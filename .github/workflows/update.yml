name: Update stats and publish site

on:
  schedule:
    # GitHub cron is in UTC. These times are Eastern Daylight Time; after DST ends (Nov 1) each runs 1 hour earlier in ET.
    - cron: "7 13 * * *"   # Every day ~9am ET: final stats, projections, injury news
    - cron: "40 15 * * 0"  # Sunday ~11:40am ET: inactives for 1pm games
    - cron: "40 19 * * 0"  # Sunday ~3:40pm ET: inactives for late games (and before SNF)
  workflow_dispatch:        # lets you run it any time from the Actions tab
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas numpy
      - name: Download stats and build data.json
        run: python fetch_data.py --out site/data.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
